<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Ink — Конвертер переписки</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23ffb84d'/><text x='16' y='22' text-anchor='middle' fill='white' font-size='18' font-weight='bold' font-family='sans-serif'>J</text></svg>"/>
<style>
:root{
  --bg:#0f1115;--panel:#171a21;--panel2:#1f232c;
  --border:#232833;--border2:#2a3040;
  --accent:#4f8cff;--accent2:#7c5cff;
  --text:#e8ecf3;--muted:#8a93a5;
  --gold:#ffb84d;--pink:#ff5c8a;--ok:#4ade80;
  --mine:#5b6cff;--them:#232936;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  line-height:1.6;min-height:100vh;
}
body::before{
  content:'';position:fixed;inset:0;z-index:-1;
  background:
    radial-gradient(900px 500px at 20% -10%,rgba(255,184,77,.15),transparent 60%),
    radial-gradient(900px 500px at 80% 10%,rgba(255,92,138,.1),transparent 60%);
}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px 40px}

.top{
  display:flex;align-items:center;gap:14px;
  padding:20px 0 24px;
  border-bottom:1px solid var(--border);
  margin-bottom:24px;
  flex-wrap:wrap;
}
.top .back{
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 16px;border-radius:12px;
  background:var(--panel2);border:1px solid var(--border2);
  color:var(--text);text-decoration:none;font-size:14px;
  cursor:pointer;font-family:inherit;
  transition:background .15s;
}
.top .back:hover{background:var(--border2)}
.top h1{margin:0;font-size:22px;font-weight:800}
.top .spacer{flex:1}
.top .logo{
  width:40px;height:40px;border-radius:11px;
  background:linear-gradient(135deg,var(--gold),var(--pink));
  display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:800;color:#fff;
  flex-shrink:0;
}

.drop-zone{
  border:2px dashed var(--border2);border-radius:18px;
  padding:60px 20px;text-align:center;
  cursor:pointer;transition:all .2s;
  background:var(--panel2);
  margin-bottom:24px;
}
.drop-zone:hover,.drop-zone.over{
  border-color:var(--gold);
  background:rgba(255,184,77,.08);
}
.drop-zone .big{font-size:72px;line-height:1;margin-bottom:18px;display:block}
.drop-zone .t1{font-size:19px;font-weight:700;margin-bottom:8px}
.drop-zone .t2{font-size:13.5px;color:var(--muted);max-width:480px;margin:0 auto}
.drop-zone input[type=file]{display:none}

.jv-stats{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:10px;margin-bottom:20px;
}
.jv-stats .s{
  background:var(--panel);border:1px solid var(--border2);
  border-radius:12px;padding:14px;text-align:center;
}
.jv-stats .s .num{font-size:24px;font-weight:800;color:var(--gold)}
.jv-stats .s .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:3px}

.jv-chat{
  background:var(--panel);border:1px solid var(--border2);
  border-radius:14px;margin-bottom:12px;overflow:hidden;
}
.jv-chat .ch-head{
  padding:14px 16px;cursor:pointer;
  display:flex;align-items:center;gap:12px;
  transition:background .15s;
}
.jv-chat .ch-head:hover{background:rgba(127,127,127,.08)}
.jv-chat .ch-head .avatar{
  width:40px;height:40px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;
  font-weight:700;color:#fff;flex-shrink:0;
}
.jv-chat .ch-head .info{flex:1;min-width:0}
.jv-chat .ch-head .t1{font-weight:700;font-size:14.5px}
.jv-chat .ch-head .t2{font-size:12px;color:var(--muted);margin-top:2px}
.jv-chat .ch-head .arrow{
  color:var(--muted);font-size:14px;
  transition:transform .2s;
}
.jv-chat.open .ch-head .arrow{transform:rotate(90deg)}

.jv-msgs{
  display:none;padding:12px 16px 16px;
  border-top:1px solid var(--border);
  flex-direction:column;gap:8px;
  max-height:450px;overflow-y:auto;
}
.jv-chat.open .jv-msgs{display:flex}
.jv-msg{
  padding:8px 12px;border-radius:12px;
  font-size:13.5px;line-height:1.45;
  max-width:85%;word-wrap:break-word;
}
.jv-msg.me{
  align-self:flex-end;
  background:linear-gradient(135deg,var(--mine),#8b5cff);
  color:#fff;
}
.jv-msg.them{
  align-self:flex-start;
  background:var(--them);border:1px solid var(--border);
}
.jv-msg .who{
  font-size:11px;font-weight:700;color:var(--accent);
  margin-bottom:3px;
}
.jv-msg.me .who{color:#cfe0ff}
.jv-msg .time{display:block;font-size:10.5px;opacity:.7;margin-top:3px;text-align:right}

.jv-empty{
  text-align:center;padding:40px 20px;color:var(--muted);font-size:14px;
}
.jv-reset{
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 16px;border-radius:10px;
  background:var(--panel2);border:1px solid var(--border2);
  color:var(--text);cursor:pointer;font-family:inherit;font-size:13.5px;
  margin-bottom:16px;
}
.jv-reset:hover{background:var(--border2)}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:8px}
</style>
</head>
<body>

<div class="wrap">

  <div class="top">
    <a class="back" href="index.html">← На главную</a>
    <h1>📊 Конвертер переписки</h1>
    <div class="spacer"></div>
    <div class="logo">J</div>
  </div>

  <div id="jvDrop">
    <div class="drop-zone" id="dropZone" onclick="document.getElementById('jsonFile').click()">
      <span class="big">📁</span>
      <div class="t1">Перетащи JSON-файл сюда</div>
      <div class="t2">или нажми, чтобы выбрать. Файл скачивается кнопкой «💾 Сохранить» в Ink. Данные никуда не отправляются — всё работает локально в браузере.</div>
      <input type="file" id="jsonFile" accept=".json,application/json" onchange="onJsonPicked(event)"/>
    </div>
  </div>

  <div id="jvResult" style="display:none"></div>

</div>

<script>
const dropZone = document.getElementById('dropZone');
['dragenter','dragover'].forEach(ev => dropZone.addEventListener(ev, e => {
  e.preventDefault(); dropZone.classList.add('over');
}));
['dragleave','drop'].forEach(ev => dropZone.addEventListener(ev, e => {
  e.preventDefault(); dropZone.classList.remove('over');
}));
dropZone.addEventListener('drop', e => {
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if(f) processJsonFile(f);
});

function onJsonPicked(e){
  const f = e.target.files && e.target.files[0];
  if(f) processJsonFile(f);
}

function processJsonFile(file){
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      renderJsonPreview(data, file.name);
    } catch(err){
      alert('Не удалось прочитать JSON: ' + err.message);
    }
  };
  reader.readAsText(file);
}

function renderJsonPreview(data, fileName){
  document.getElementById('jvDrop').style.display = 'none';
  const res = document.getElementById('jvResult');
  res.style.display = 'block';

  let chats = [];

  if(Array.isArray(data.chats)){
    const messages = data.messages || {};
    const me = data.me || (data.currentUser && data.currentUser.id);
    data.chats.forEach(c => {
      const msgs = (messages[c.id] || []).map(m => normalizeMsg(m, me, c));
      chats.push({ id: c.id, title: c.name || c.title || ('Чат ' + c.id), messages: msgs });
    });
  } else if(Array.isArray(data)){
    const grouped = {};
    data.forEach(m => {
      const cid = m.chat_id || m.chatId || 'unknown';
      if(!grouped[cid]) grouped[cid] = [];
      grouped[cid].push(normalizeMsg(m, null, null));
    });
    Object.keys(grouped).forEach(cid => chats.push({ id: cid, title: 'Чат ' + cid, messages: grouped[cid] }));
  } else if(Array.isArray(data.messages)){
    const grouped = {};
    data.messages.forEach(m => {
      const cid = m.chat_id || m.chatId || 'unknown';
      if(!grouped[cid]) grouped[cid] = [];
      grouped[cid].push(normalizeMsg(m, null, null));
    });
    Object.keys(grouped).forEach(cid => chats.push({ id: cid, title: 'Чат ' + cid, messages: grouped[cid] }));
  } else if(data.chat && Array.isArray(data.messages)){
    chats.push({
      id: data.chat.id,
      title: data.chat.name || 'Чат',
      messages: data.messages.map(m => normalizeMsg(m, null, data.chat))
    });
  } else {
    res.innerHTML = '<div class="jv-empty">Не удалось распознать структуру JSON.<br>Покажу как есть:</div>' +
      '<pre style="background:var(--panel2);padding:14px;border-radius:12px;overflow:auto;font-size:12px">' +
      escapeHtml(JSON.stringify(data, null, 2)) + '</pre>';
    return;
  }

  let totalMsgs = 0;
  chats.forEach(c => totalMsgs += c.messages.length);

  let html = `
    <div class="jv-reset" onclick="resetJsonViewer()">← Загрузить другой файл</div>
    <div class="jv-stats">
      <div class="s"><div class="num">${chats.length}</div><div class="lbl">Чатов</div></div>
      <div class="s"><div class="num">${totalMsgs}</div><div class="lbl">Сообщений</div></div>
      <div class="s"><div class="num">${escapeHtml(fileName).slice(0,20)}</div><div class="lbl">Файл</div></div>
    </div>
  `;

  if(!chats.length){
    html += '<div class="jv-empty">Нет данных для отображения</div>';
  } else {
    chats.forEach((c, idx) => {
      html += `
        <div class="jv-chat" data-idx="${idx}">
          <div class="ch-head" onclick="toggleChat(${idx})">
            <div class="avatar">${escapeHtml((c.title||'?')[0].toUpperCase())}</div>
            <div class="info">
              <div class="t1">${escapeHtml(c.title)}</div>
              <div class="t2">${c.messages.length} сообщений</div>
            </div>
            <div class="arrow">▶</div>
          </div>
          <div class="jv-msgs">${c.messages.map(m => msgHtml(m)).join('')}</div>
        </div>
      `;
    });
  }

  res.innerHTML = html;
}

function normalizeMsg(m, me, chat){
  const senderId = m.sender_id || m.from || m.user_id || m.userId || null;
  const senderName = m.sender_name || m.from_login || m.username || (senderId ? ('ID ' + senderId) : 'Неизвестно');
  const isMe = me ? (senderId === me) : false;
  return {
    who: senderName,
    text: m.text || m.message || '',
    time: m.created_at || m.at || m.time || '',
    isMe
  };
}

function msgHtml(m){
  const cls = m.isMe ? 'me' : 'them';
  const who = m.isMe ? '' : `<div class="who">${escapeHtml(m.who)}</div>`;
  let time = '';
  if(m.time){
    try { time = new Date(m.time).toLocaleString('ru-RU'); } catch(e){ time = m.time; }
  }
  return `<div class="jv-msg ${cls}">${who}${escapeHtml(m.text)}${time ? `<span class="time">${escapeHtml(time)}</span>` : ''}</div>`;
}

function toggleChat(idx){
  const el = document.querySelector(`.jv-chat[data-idx="${idx}"]`);
  if(el) el.classList.toggle('open');
}

function resetJsonViewer(){
  document.getElementById('jvDrop').style.display = 'block';
  document.getElementById('jvResult').style.display = 'none';
  document.getElementById('jvResult').innerHTML = '';
  document.getElementById('jsonFile').value = '';
}

function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}
</script>

</body>
</html>
